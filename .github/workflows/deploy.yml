name: Dhukuti CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Check: TypeScript compiles on both FE and BE ──
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install & typecheck backend
        working-directory: ./server
        run: |
          npm ci
          npm run lint

      - name: Install & typecheck frontend
        working-directory: ./client
        run: |
          npm ci
          npx tsc --noEmit

  # ── Deploy frontend to Vercel (main branch only) ──
  deploy-frontend:
    name: Deploy to Vercel
    needs: typecheck
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./client
          vercel-args: '--prod'

  # ── Deploy backend: Render auto-deploys from GitHub ──
  # No action needed — connect Render to GitHub repo
  # and it deploys server/ automatically on every push to main

